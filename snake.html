<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake</title><style>body{margin:0;background:#070b16;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}canvas{background:#0d1426;border:2px solid #7c5cff;border-radius:12px}.ui{display:flex;gap:12px;align-items:center;margin-bottom:10px}button{background:#7c5cff;color:#fff;border:0;padding:10px 14px;border-radius:8px}a{color:#9fb4ff}</style></head><body><div><div class="ui"><b>Snake</b><span id="score">0</span><button id="start">Start</button><a href="../index.html">Back</a></div><canvas id="c" width="360" height="360"></canvas></div><script>const c=document.getElementById("c"),x=c.getContext("2d");let s,food,dir,score=0,alive=false;function reset(){s=[{x:8,y:8}];dir={x:1,y:0};food={x:12,y:12};score=0;document.getElementById("score").textContent=0}function start(){reset();alive=true;loop()}document.getElementById("start").onclick=start;document.addEventListener("keydown",e=>{if(e.key==="ArrowUp"&&dir.y!==1)dir={x:0,y:-1};if(e.key==="ArrowDown"&&dir.y!==-1)dir={x:0,y:1};if(e.key==="ArrowLeft"&&dir.x!==1)dir={x:-1,y:0};if(e.key==="ArrowRight"&&dir.x!==-1)dir={x:1,y:0}});function loop(){if(!alive)return;const h={x:(s[0].x+dir.x+20)%20,y:(s[0].y+dir.y+20)%20};if(s.some(p=>p.x===h.x&&p.y===h.y)){alive=false;submit();return}s.unshift(h);if(h.x===food.x&&h.y===food.y){score+=10;document.getElementById("score").textContent=score;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)}}else s.pop();x.fillStyle="#0d1426";x.fillRect(0,0,360,360);x.fillStyle="#00e5a0";x.fillRect(food.x*18,food.y*18,16,16);x.fillStyle="#7c5cff";s.forEach(p=>x.fillRect(p.x*18,p.y*18,16,16));setTimeout(()=>requestAnimationFrame(loop),110)}function submit(){parent.postMessage({type:"FEXO_GAME_SCORE",game:"snake",score},"*")}</script></body></html>
