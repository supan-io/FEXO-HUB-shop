<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tic Tac Toe</title><style>body{margin:0;background:#070b16;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.board{display:grid;grid-template-columns:repeat(3,90px);gap:8px}.cell{height:90px;background:#121829;border:2px solid #2a355a;border-radius:10px;font-size:38px;color:#fff}button{background:#7c5cff;color:#fff;border:0;padding:10px 14px;border-radius:8px;margin-top:12px}a{color:#9fb4ff}</style></head><body><div style="text-align:center"><h2>Tic Tac Toe</h2><div class="board" id="b"></div><p id="msg">Your turn</p><button onclick="reset()">Restart</button><br><a href="../index.html">Back</a></div><script>let b,turn,won;function reset(){b=Array(9).fill("");turn="X";won=false;draw()}function draw(){document.getElementById("b").innerHTML=b.map((v,i)=>`<button class="cell" onclick="play(${i})">${v}</button>`).join("")}function play(i){if(won||b[i])return;b[i]=turn;check();turn=turn==="X"?"O":"X";if(!won&&turn==="O")ai();draw()}function ai(){const empty=b.map((v,i)=>v?null:i).filter(v=>v!==null);if(!empty.length)return;const i=empty[Math.floor(Math.random()*empty.length)];b[i]="O";check();turn="X"}function check(){const w=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const[a,c,d]of w){if(b[a]&&b[a]===b[c]&&b[a]===b[d]){won=true;document.getElementById("msg").textContent=b[a]+" wins!";if(b[a]==="X")submit();return}}if(!b.includes("")){won=true;document.getElementById("msg").textContent="Draw!"}}function submit(){parent.postMessage({type:"FEXO_GAME_SCORE",game:"tictactoe",score:100},"*")}reset()</script></body></html>
