for(const p of pads){
if(!p)continue;
const lx=p.axes[0]||0,ly=p.axes[1]||0;
input.left=lx<-0.3;input.right=lx>0.3;

}}

if(type==='bike'){
const frame=new THREE.Mesh(new THREE.BoxGeometry(0.28,0.35,1.55),bodyMat);frame.position.y=0.55;g.add(frame);
const rider=buildHuman();rider.scale.setScalar(0.88);rider.position.set(0,0.35,-0.15);g.add(rider);
for(const z of[0.85,-0.85]){const wheel=makeWheel(wheelR,0.14);wheel.position.set(0,wheelR,z);g.add(wheel);}
addLights(g,0.7,0.75,1.0,-0.95);}
else if(type==='truck'){
const cab=new THREE.Mesh(new THREE.BoxGeometry(w,2.4,2.5),bodyMat);cab.position.set(0,1.5,l/2-1.35);g.add(cab);
const cargo=new THREE.Mesh(new THREE.BoxGeometry(w,2.7,l-3.2),new THREE.MeshLambertMaterial({color:0xf2f2f2}));cargo.position.set(0,1.75,-1.7);g.add(cargo);
for(const z of[l/2-1.1,-l/2+1.1,-l/2+2.6])for(const side of[-1,1]){const wheel=makeWheel(wheelR,0.38);wheel.position.set(side*(w/2-0.18),wheelR,z);g.add(wheel);}
addLights(g,w,1.0,l/2,-l/2);}
else if(type==='bus'){
const main=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),bodyMat);main.position.y=h/2+0.35;g.add(main);
for(let i=0;i<5;i++){const win=new THREE.Mesh(new THREE.BoxGeometry(w+0.03,0.85,1.15),glassMat);win.position.set(0,h*0.68,-l/2+1.35+i*2.2);g.add(win);}
for(const z of[l/2-1.6,-l/2+1.6])for(const side of[-1,1]){const wheel=makeWheel(wheelR,0.36);wheel.position.set(side*(w/2-0.2),wheelR,z);g.add(wheel);}
addLights(g,w,1.0,l/2,-l/2);}
else{
const lower=new THREE.Mesh(new THREE.BoxGeometry(w,h*0.55,l),bodyMat);lower.position.y=wheelR+h*0.28;g.add(lower);
const cabin=new THREE.Mesh(new THREE.BoxGeometry(w*0.86,h*0.55,l*0.52),bodyMat);cabin.position.set(0,wheelR+h*0.72,-0.25);g.add(cabin);
for(const[x,z]of[[-w/2+0.2,l/2-0.75],[w/2-0.2,l/2-0.75],[-w/2+0.2,-l/2+0.75],[w/2-0.2,-l/2+0.75]]){const wheel=makeWheel(wheelR,0.3);wheel.position.set(x,wheelR,z);g.add(wheel);}
addLights(g,w,wheelR+h*0.35,l/2,-l/2);}
scene.add(g);
const lane=Math.random()<0.5?-LANE_OFFSET:LANE_OFFSET;
const vertical=Math.random()<0.5;
const roadLine=(Math.floor(Math.random()*39)-19)*ROAD_STEP;
let x,z,dirAngle;
if(vertical){x=roadLine+lane;z=-7600+Math.random()*15200;dirAngle=Math.random()<0.5?0:Math.PI;}
else{z=roadLine+lane;x=-7600+Math.random()*15200;dirAngle=Math.random()<0.5?Math.PI/2:-Math.PI/2;}
g.position.set(x,ROAD_Y,z);g.rotation.y=dirAngle;
vehicles.push({mesh:g,type,speed,dir:dirAngle,lane,laneTarget:lane,kx:0,kz:0});}
// 350 vehicles: distribute types
const typeCounts={car:150,suv:50,monster:15,truck:30,bus:20,bike:85};
for(const[type,count]of Object.entries(typeCounts))for(let i=0;i<count;i++)makeVehicle(type);
const cops=[];
function spawnCop(){const g=new THREE.Group();
const b=new THREE.Mesh(new THREE.BoxGeometry(2,1,4),new THREE.MeshLambertMaterial({color:0x0000ff}));b.position.y=0.7;g.add(b);
g.position.set(Math.random()*400-200,ROAD_Y,Math.random()*400-200);scene.add(g);cops.push({mesh:g});}
let damage=0,points=0,money=0,wanted=0,boostEnergy=100,speedCap=149.85,currentShop=null;
let lightTimer=0,phase=0,pedHitCooldown=0,vehicleHitCooldown=0;const periods=[8,2,8,2];
let dayTime=0,cullTimer=0;
let fps=60,frames=0,fpsTimer=0;
function updateHUD(){document.getElementById('damage').textContent=Math.round(damage);document.getElementById('points').textContent=points;document.getElementById('money').textContent=money;document.getElementById('wanted').textContent=wanted;document.getElementById('boost').textContent=Math.round(boostEnergy);document.getElementById('shopMoney').textContent=money;}
function aabbHit(px,pz){for(const b of buildings){if(px>b.minX-1&&px<b.maxX+1&&pz>b.minZ-1&&pz<b.maxZ+1)return b}return null}
function vehicleBuildingHit(v){const p=v.mesh.position;for(const b of buildings){if(p.x>b.minX-2&&p.x<b.maxX+2&&p.z>b.minZ-2&&p.z<b.maxZ+2)return true}return false;}
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),0.05);
// FPS tracking + adaptive quality
frames++;fpsTimer+=dt;
if(fpsTimer>1){fps=Math.round(frames/fpsTimer);frames=0;fpsTimer=0;
document.getElementById('fps').textContent=fps;
// Adaptive pixel ratio for 60-120fps target
if(fps<50&&pixelRatio>0.75){pixelRatio=Math.max(0.75,pixelRatio-0.25);renderer.setPixelRatio(pixelRatio);}
else if(fps>100&&pixelRatio<Math.min(devicePixelRatio,1.5)){pixelRatio=Math.min(Math.min(devicePixelRatio,1.5),pixelRatio+0.25);renderer.setPixelRatio(pixelRatio);}
}
pollGamepad();
dayTime=(dayTime+dt)%(DAY_LENGTH+NIGHT_LENGTH);
const isDay=dayTime<DAY_LENGTH;
const t=isDay?dayTime/DAY_LENGTH:(dayTime-DAY_LENGTH)/NIGHT_LENGTH;
if(isDay){
const angle=t*Math.PI;
sun.position.set(Math.cos(angle)*3000,Math.sin(angle)*2500+500,3000);
sunLight.position.copy(sun.position);sunLight.intensity=1.2*Math.sin(angle);
moon.visible=false;sun.visible=true;
skyMat.color.setHex(0x87ceeb);scene.fog.color.setHex(0x87ceeb);
document.getElementById('time').textContent='Day';
}else{
const angle=t*Math.PI;
moon.position.set(Math.cos(angle)*3000,Math.sin(angle)*2500+500,-3000);
moonLight.position.copy(moon.position);moonLight.intensity=0.3*Math.sin(angle);
sun.visible=false;moon.visible=true;
skyMat.color.setHex(0x0a0a2a);scene.fog.color.setHex(0x0a0a2a);
document.getElementById('time').textContent='Night';
}
const lampColor=isDay?0x555555:0xfff3b0;
if(lamps.material.color.getHex()!==lampColor)lamps.material.color.setHex(lampColor);
clouds.forEach(c=>{c.position.x+=5*dt;if(c.position.x>8000)c.position.x=-8000;});
cullTimer+=dt;
if(cullTimer>0.25){cullTimer=0;chunks.forEach(c=>{c.visible=c.userData.center.distanceTo(pos)<VIEW_DISTANCE+CHUNK;});}
lightTimer+=dt;if(lightTimer>periods[phase]){lightTimer=0;phase=(phase+1)%4;
const vColor=phase===0?0x00ff00:phase===1?0xffff00:0xff0000;
const hColor=phase===2?0x00ff00:phase===3?0xffff00:0xff0000;
lights.forEach(l=>{l.lampV.material.color.setHex(vColor);l.lampH.material.color.setHex(hColor);});}
let throttle=0;if(input.up)throttle=1;if(input.down)throttle=-0.6;
let steer=0;if(input.left)steer=1;if(input.right)steer=-1;
let boosting=false;
if(input.boost&&boostEnergy>0){boosting=true;boostEnergy-=30*dt}else{boostEnergy=Math.min(100,boostEnergy+10*dt)}
const maxSpeed=boosting?166.5:speedCap;
speed+=throttle*(boosting?90:60)*dt;speed-=speed*0.5*dt;
if(input.down&&speed>0)speed-=120*dt;
speed=Math.max(-20,Math.min(maxSpeed,speed));
heading+=steer*1.8*dt*(speed/30);
const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
pos.addScaledVector(forward,speed*dt);
pos.x=Math.max(-HALF+50,Math.min(HALF-50,pos.x));pos.z=Math.max(-HALF+50,Math.min(HALF-50,pos.z));
const hit=aabbHit(pos.x,pos.z);
if(hit){pos.addScaledVector(forward,-speed*dt);speed*=-0.3;damage+=5;updateHUD();}
rickshaw.position.copy(pos);rickshaw.position.y=ROAD_Y;rickshaw.rotation.y=heading;
const kmh=Math.abs(speed*3.6);
if(kmh>=150){camYaw*=Math.max(0,1-dt*3);camPitch+=(0.25-camPitch)*Math.min(1,dt*3);}
if(cameraMode==='TPP'){
const offset=new THREE.Vector3(0,6,-12).applyAxisAngle(new THREE.Vector3(0,1,0),heading+camYaw);
offset.y+=camPitch*10;camera.position.copy(pos).add(offset);camera.lookAt(pos.x,1.5,pos.z);
}else{
const eye=new THREE.Vector3(0,1.75,0.9).applyAxisAngle(new THREE.Vector3(0,1,0),heading);
camera.position.copy(pos).add(eye);
const look=new THREE.Vector3(Math.sin(heading+camYaw),Math.sin(camPitch),Math.cos(heading+camYaw));
camera.lookAt(camera.position.clone().add(look));
}
pedHitCooldown=Math.max(0,pedHitCooldown-dt);
vehicleHitCooldown=Math.max(0,vehicleHitCooldown-dt);
peds.forEach(p=>{
if(p.knocked){p.timer-=dt;p.mesh.position.x+=p.kx*dt;p.mesh.position.z+=p.kz*dt;p.kx*=0.9;p.kz*=0.9;
if(p.timer<=0){p.knocked=false;p.mesh.rotation.x=0;p.chasing=true}}
else if(p.chasing){const dx=pos.x-p.mesh.position.x,dz=pos.z-p.mesh.position.z,dist=Math.hypot(dx,dz);
if(dist<30){p.mesh.position.x+=dx/dist*6*dt;p.mesh.position.z+=dz/dist*6*dt;p.mesh.rotation.y=Math.atan2(dx,dz);}}
else{p.mesh.position.x+=Math.sin(p.dir)*6*dt;p.mesh.position.z+=Math.cos(p.dir)*6*dt;if(Math.random()<0.01)p.dir+=Math.PI/2;}
const roadX=nearestRoad(p.mesh.position.x),roadZ=nearestRoad(p.mesh.position.z);
const distX=Math.abs(p.mesh.position.x-roadX),distZ=Math.abs(p.mesh.position.z-roadZ);
if(distX<distZ)p.mesh.position.x=THREE.MathUtils.clamp(p.mesh.position.x,roadX-40,roadX+40);
else p.mesh.position.z=THREE.MathUtils.clamp(p.mesh.position.z,roadZ-40,roadZ+40);
const dx=pos.x-p.mesh.position.x,dz=pos.z-p.mesh.position.z;
if(pedHitCooldown<=0&&Math.hypot(dx,dz)<1.5&&!p.knocked){pedHitCooldown=0.6;p.knocked=true;p.timer=3;p.mesh.rotation.x=Math.PI/2;
const away=new THREE.Vector3(dx,0,dz).normalize();p.kx=away.x*10;p.kz=away.z*10;
points+=10;money+=10;wanted+=1;updateHUD();}});
vehicles.forEach(v=>{
const isVertical=Math.abs(Math.sin(v.dir))<0.5;
const redForMe=isVertical?(phase===2||phase===3):(phase===0||phase===1);
if(redForMe){for(const l of lights){if(Math.hypot(v.mesh.position.x-l.x,v.mesh.position.z-l.z)<50){v.speed=0;break}}}
v.mesh.position.x+=Math.sin(v.dir)*v.speed*dt;v.mesh.position.z+=Math.cos(v.dir)*v.speed*dt;
v.mesh.position.x+=v.kx*dt;v.mesh.position.z+=v.kz*dt;v.kx*=0.9;v.kz*=0.9;
if(v.mesh.position.x>HALF)v.mesh.position.x=-HALF;if(v.mesh.position.x<-HALF)v.mesh.position.x=HALF;
if(v.mesh.position.z>HALF)v.mesh.position.z=-HALF;if(v.mesh.position.z<-HALF)v.mesh.position.z=HALF;
const roadX=nearestRoad(v.mesh.position.x),roadZ=nearestRoad(v.mesh.position.z);
const distX=Math.abs(v.mesh.position.x-roadX),distZ=Math.abs(v.mesh.position.z-roadZ);
if(distX<distZ)v.mesh.position.x=THREE.MathUtils.clamp(v.mesh.position.x,roadX-18,roadX+18);
else v.mesh.position.z=THREE.MathUtils.clamp(v.mesh.position.z,roadZ-18,roadZ+18);
if(vehicleBuildingHit(v)){v.mesh.position.x-=Math.sin(v.dir)*v.speed*dt;v.mesh.position.z-=Math.cos(v.dir)*v.speed*dt;v.speed=0;}
const dx=pos.x-v.mesh.position.x,dz=pos.z-v.mesh.position.z;
const hitRadius=v.type==='bus'?4.2:v.type==='truck'?3.4:v.type==='monster'?2.8:v.type==='bike'?1.4:2.2;
if(vehicleHitCooldown<=0&&Math.hypot(dx,dz)<hitRadius){vehicleHitCooldown=1;
damage+=v.type==='bike'?10:20;points+=v.type==='bike'?15:20;money+=v.type==='bike'?15:20;wanted+=1;
const away=new THREE.Vector3(dx,0,dz).normalize();v.kx=away.x*15;v.kz=away.z*15;v.mesh.position.addScaledVector(away,3);updateHUD();}});
cops.forEach(c=>{const dx=pos.x-c.mesh.position.x,dz=pos.z-c.mesh.position.z,dist=Math.hypot(dx,dz);
if(dist>2){c.mesh.position.x+=dx/dist*43*dt;c.mesh.position.z+=dz/dist*43*dt;c.mesh.rotation.y=Math.atan2(dx,dz);}
else{money=Math.max(0,money-20);updateHUD();}});
if(wanted>3&&cops.length<2)spawnCop();
let nearShop=null;
shops.forEach(s=>{if(Math.hypot(pos.x-s.x,pos.z-s.z)<10)nearShop=s});
currentShop=nearShop;
document.getElementById('shopHint').style.display=nearShop?'block':'none';
if(nearShop)document.getElementById('shopHint').textContent='Tap / press E to enter '+nearShop.name;
document.getElementById('speed').textContent=Math.abs(Math.round(speed*3.6));
renderer.render(scene,camera);}
animate();
renderer.domElement.addEventListener('pointerdown',()=>{if(currentShop)openShop()});
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function openShop(){if(currentShop){document.getElementById('shopTitle').textContent=currentShop.name;document.getElementById('shopModal').classList.add('open')}}
document.getElementById('btnClose').onclick=()=>document.getElementById('shopModal').classList.remove('open');
document.getElementById('btnRepair').onclick=()=>{if(money>=50){money-=50;damage=0;updateHUD();document.getElementById('shopModal').classList.remove('open')}};
document.getElementById('btnBoostBuy').onclick=()=>{if(money>=100){money-=100;speedCap=180;updateHUD();document.getElementById('shopModal').classList.remove('open')}};
</script>
</body>
</html>
