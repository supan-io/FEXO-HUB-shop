<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Rickshaw City - FEXO HUB</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
canvas{display:block}
#hud{position:fixed;top:10px;left:10px;color:#fff;font-size:14px;background:rgba(0,0,0,.5);padding:8px 12px;border-radius:8px;z-index:10}
#hud div{margin:2px 0}
#controls{position:fixed;bottom:20px;width:100%;display:flex;justify-content:space-between;padding:0 20px;z-index:10}
.ctrl-group{display:flex;flex-direction:column;gap:10px}
.ctrl-group.right{flex-direction:row}
button{width:70px;height:70px;border:0;border-radius:50%;background:rgba(0,229,255,.8);color:#000;font-size:13px;font-weight:bold;cursor:pointer;user-select:none;touch-action:none}
button:active{background:#00e5ff}
#btnBoost{background:rgba(255,215,0,.9)}
#shopHint{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);color:#ffd700;font-size:16px;background:rgba(0,0,0,.7);padding:8px 16px;border-radius:8px;display:none;z-index:10}
#shopModal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:none;place-items:center;z-index:20}
#shopModal.open{display:grid}
#shopBox{background:#0a0f1e;border:1px solid #00e5ff;border-radius:12px;padding:20px;color:#fff;text-align:center}
#shopBox button{width:auto;height:auto;padding:10px 20px;border-radius:8px;margin:5px}
</style></head><body>
<div id="hud">
<div>Speed: <span id="speed">0</span> km/h</div>
<div>Damage: <span id="damage">0</span>%</div>
<div>Points: <span id="points">0</span></div>
<div>Money: <span id="money">0</span> ৳</div>
<div>Wanted: <span id="wanted">0</span></div>
<div>Boost: <span id="boost">100</span>%</div>
</div>
<div id="controls">
<div class="ctrl-group left">
<button id="btnUp">SPEED</button>
<button id="btnBrake">BRAKE</button>
<button id="btnDown">REVERSE</button>
<button id="btnBoost">BOOST</button>
</div>
<div class="ctrl-group right">
<button id="btnLeft">LEFT</button>
<button id="btnRight">RIGHT</button>
</div>
</div>
<div id="shopHint">Press E / tap to enter shop</div>
<div id="shopModal"><div id="shopBox"><h3 id="shopTitle">Rickshaw Shop</h3><p>Money: <span id="shopMoney">0</span> ৳</p>
<button id="btnRepair">Repair (50৳)</button><button id="btnBoostBuy">Speed Upgrade (100৳)</button><button id="btnClose">Close</button></div></div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
const MAP=15600,HALF=7800;
const renderer=new THREE.WebGLRenderer({antialias:true,logarithmicDepthBuffer:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
document.body.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87ceeb);
scene.fog=new THREE.Fog(0x87ceeb,100,1500);
const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,1,20000);
scene.add(new THREE.HemisphereLight(0xffffff,0x444444,1));
const dir=new THREE.DirectionalLight(0xffffff,1);dir.position.set(100,200,100);scene.add(dir);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(MAP,MAP),new THREE.MeshLambertMaterial({color:0x228B22}));
ground.rotation.x=-Math.PI/2;scene.add(ground);
const roadMat=new THREE.MeshLambertMaterial({color:0x333333});
const sidewalkMat=new THREE.MeshLambertMaterial({color:0x999999});
const waterMat=new THREE.MeshLambertMaterial({color:0x1e90ff});
const wallMat=new THREE.MeshLambertMaterial({color:0x555555});
function addRoad(x,z,w,l){const r=new THREE.Mesh(new THREE.PlaneGeometry(w,l),roadMat);r.rotation.x=-Math.PI/2;r.position.set(x,0.5,z);scene.add(r);}
function addSidewalk(x,z,w,l){const s=new THREE.Mesh(new THREE.PlaneGeometry(w,l),sidewalkMat);s.rotation.x=-Math.PI/2;s.position.set(x,0.6,z);scene.add(s);}
for(let x=-7600;x<=7600;x+=400){
addRoad(x,0,60,MAP);
for(let z=-7600;z<7600;z+=400){addSidewalk(x-35,z+200,10,340);addSidewalk(x+35,z+200,10,340);}}
for(let z=-7600;z<=7600;z+=400){
addRoad(0,z,MAP,60);
for(let x=-7600;x<7600;x+=400){addSidewalk(x+200,z-35,340,10);addSidewalk(x+200,z+35,340,10);}}
// Zebra crossings as footpath connectors
const zebraCanvas=document.createElement('canvas');zebraCanvas.width=64;zebraCanvas.height=64;
const zctx=zebraCanvas.getContext('2d');zctx.fillStyle='#fff';zctx.fillRect(0,0,64,64);zctx.fillStyle='#333';for(let i=0;i<8;i++)zctx.fillRect(i*8,0,4,64);
const zebraTex=new THREE.CanvasTexture(zebraCanvas);
const zebraMat=new THREE.MeshLambertMaterial({map:zebraTex});
for(let x=-7600;x<=7600;x+=400)for(let z=-7600;z<=7600;z+=400){
const zv1=new THREE.Mesh(new THREE.PlaneGeometry(60,10),zebraMat);
zv1.rotation.x=-Math.PI/2;zv1.position.set(x,0.55,z-35);scene.add(zv1);
const zv2=new THREE.Mesh(new THREE.PlaneGeometry(60,10),zebraMat);
zv2.rotation.x=-Math.PI/2;zv2.position.set(x,0.55,z+35);scene.add(zv2);
const zh1=new THREE.Mesh(new THREE.PlaneGeometry(10,60),zebraMat);
zh1.rotation.x=-Math.PI/2;zh1.position.set(x-35,0.55,z);scene.add(zh1);
const zh2=new THREE.Mesh(new THREE.PlaneGeometry(10,60),zebraMat);
zh2.rotation.x=-Math.PI/2;zh2.position.set(x+35,0.55,z);scene.add(zh2);}
// Traffic lights at corners, independent signals per road (V and H)
const lights=[];
for(let x=-7600;x<=7600;x+=1600)for(let z=-7600;z<=7600;z+=1600){
const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.5,0.5,8,8),new THREE.MeshLambertMaterial({color:0x333333}));
pole.position.set(x+35,4,z+35);scene.add(pole);
const box=new THREE.Mesh(new THREE.BoxGeometry(2,6,1),new THREE.MeshLambertMaterial({color:0x222222}));
box.position.set(x+35,8,z+35);scene.add(box);
const lampV=new THREE.Mesh(new THREE.SphereGeometry(0.8,8,8),new THREE.MeshLambertMaterial({color:0x00ff00}));
lampV.position.set(x+35,10,z+35);scene.add(lampV);
const lampH=new THREE.Mesh(new THREE.SphereGeometry(0.8,8,8),new THREE.MeshLambertMaterial({color:0xff0000}));
lampH.position.set(x+35,7,z+35);scene.add(lampH);
lights.push({x,z,lampV,lampH});}
// Border walls
const wallH=10;
[[0,HALF,MAP,10],[0,-HALF,MAP,10],[HALF,0,10,MAP],[-HALF,0,10,MAP]].forEach(([x,z,w,l])=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,wallH,l),wallMat);m.position.set(x,wallH/2,z);scene.add(m);});
const river=new THREE.Mesh(new THREE.PlaneGeometry(200,MAP),waterMat);
river.rotation.x=-Math.PI/2;river.position.set(7400,0.7,0);scene.add(river);
for(const z of[-4000,0,4000]){const b=new THREE.Mesh(new THREE.PlaneGeometry(220,12),roadMat);b.rotation.x=-Math.PI/2;b.position.set(7400,0.8,z);scene.add(b);}
const COUNT=6000;
const bGeo=new THREE.BoxGeometry(1,1,1);
const bMat=new THREE.MeshLambertMaterial({color:0x888888});
const inst=new THREE.InstancedMesh(bGeo,bMat,COUNT);
const dummy=new THREE.Object3D();
const buildings=[];
let idx=0;
for(let bx=-7600;bx<=7600;bx+=400){
for(let bz=-7600;bz<=7600;bz+=400){
if(idx>=COUNT)break;
const s=bx+50,t=bz+50;
for(let i=0;i<2;i++)for(let j=0;j<2;j++){
if(idx>=COUNT)break;
const x=s+80+i*150,z=t+80+j*150;
if(Math.abs(x-7400)<150)continue;
const w=130,d=130,h=15+Math.random()*40;
dummy.position.set(x,h/2,z);dummy.scale.set(w,h,d);dummy.updateMatrix();
inst.setMatrixAt(idx,dummy.matrix);
inst.setColorAt(idx,new THREE.Color().setHSL(Math.random(),0.4,0.5));
buildings.push({minX:x-w/2,maxX:x+w/2,minZ:z-d/2,maxZ:z+d/2});
idx++;}}}
scene.add(inst);
const shopTypes=[["Tea Stall",0xffa500],["Grocery",0x00ff00],["Pharmacy",0xff0000],["Mobile Recharge",0x00ffff],["Tailor",0xff00ff],["Restaurant",0xffff00]];
const shops=[];
for(let i=0;i<100;i++){
const vertical=Math.random()<0.5;
const roadCoord=(Math.floor(Math.random()*38)-19)*400;
const along=(Math.random()*2-1)*7600;
const side=Math.random()<0.5?35:-35;
let x,z;
if(vertical){x=roadCoord+side;z=along}else{z=roadCoord+side;x=along}
const t=shopTypes[Math.floor(Math.random()*shopTypes.length)];
const s=new THREE.Mesh(new THREE.BoxGeometry(8,4,8),new THREE.MeshLambertMaterial({color:t[1]}));
s.position.set(x,2,z);scene.add(s);
shops.push({x,z,name:t[0]});}
function buildRickshaw(){const g=new THREE.Group();
const body=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.2,2.6),new THREE.MeshLambertMaterial({color:0x00ff00}));
body.position.y=0.8;g.add(body);
const canopy=new THREE.Mesh(new THREE.CylinderGeometry(0.9,0.9,2.4,12,1,true,0,Math.PI),new THREE.MeshLambertMaterial({color:0xff0000,side:THREE.DoubleSide}));
canopy.rotation.z=Math.PI/2;canopy.position.set(0,1.6,-0.2);g.add(canopy);
const wheelGeo=new THREE.CylinderGeometry(0.35,0.35,0.2,12);
const wheelMat=new THREE.MeshLambertMaterial({color:0x111111});
for(const[x,z]of[[-0.8,0.9],[0.8,0.9],[-0.8,-0.9],[0.8,-0.9]]){const w=new THREE.Mesh(wheelGeo,wheelMat);w.rotation.z=Math.PI/2;w.position.set(x,0.35,z);g.add(w);}
const driver=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.8,0.4),new THREE.MeshLambertMaterial({color:0x0000ff}));
driver.position.set(0,1.4,0.6);g.add(driver);return g;}
const rickshaw=buildRickshaw();scene.add(rickshaw);
let pos=new THREE.Vector3(0,0,0),heading=0,speed=0;
const input={up:false,down:false,left:false,right:false,boost:false};
addEventListener('keydown',e=>{if(e.key==='w'||e.key==='ArrowUp')input.up=true;if(e.key==='s'||e.key==='ArrowDown')input.down=true;if(e.key==='a'||e.key==='ArrowLeft')input.left=true;if(e.key==='d'||e.key==='ArrowRight')input.right=true;if(e.key==='shift')input.boost=true;if(e.key==='e')openShop()});
addEventListener('keyup',e=>{if(e.key==='w'||e.key==='ArrowUp')input.up=false;if(e.key==='s'||e.key==='ArrowDown')input.down=false;if(e.key==='a'||e.key==='ArrowLeft')input.left=false;if(e.key==='d'||e.key==='ArrowRight')input.right=false;if(e.key==='shift')input.boost=false});
function bind(id,prop){const el=document.getElementById(id);el.addEventListener('pointerdown',e=>{e.preventDefault();input[prop]=true});el.addEventListener('pointerup',()=>input[prop]=false);el.addEventListener('pointerleave',()=>input[prop]=false);}
bind('btnUp','up');bind('btnDown','down');bind('btnLeft','left');bind('btnRight','right');bind('btnBoost','boost');
const peds=[];
for(let i=0;i<80;i++){const g=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(0.3,0.8,4,8),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(Math.random(),0.6,0.6)}));
body.position.y=0.9;g.add(body);
const head=new THREE.Mesh(new THREE.SphereGeometry(0.25,8,8),new THREE.MeshLambertMaterial({color:0xffcc99}));
head.position.y=1.6;g.add(head);
g.position.set(Math.random()*2000-1000,0,Math.random()*2000-1000);scene.add(g);
peds.push({mesh:g,dir:Math.random()*Math.PI*2,knocked:false,timer:0,chasing:false,kx:0,kz:0});}
const vehicles=[];
function makeVehicle(type){const g=new THREE.Group();
let w,h,l,wr;
if(type==='car'){w=1.8;h=1.5;l=4.7;wr=0.4;}
if(type==='suv'){w=2.0;h=1.8;l=5.0;wr=0.45;}
if(type==='monster'){w=3.5;h=3.5;l=5.5;wr=1.2;}
if(type==='truck'){w=2.5;h=3.5;l=8;wr=0.6;}
if(type==='bus'){w=2.5;h=3.2;l=11;wr=0.6;}
if(type==='bike'){w=0.7;h=1.1;l=2.0;wr=0.3;}
const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,l),new THREE.MeshLambertMaterial({color:new THREE.Color().setHSL(Math.random(),0.7,0.5)}));
b.position.y=h/2;g.add(b);
const wg=new THREE.CylinderGeometry(wr,wr,0.3,10);
const wm=new THREE.MeshLambertMaterial({color:0x111111});
for(const[x,z]of[[-w/2+0.2,l/2-0.5],[w/2-0.2,l/2-0.5],[-w/2+0.2,-l/2+0.5],[w/2-0.2,-l/2+0.5]]){const wheel=new THREE.Mesh(wg,wm);wheel.rotation.z=Math.PI/2;wheel.position.set(x,wr,z);g.add(wheel);}
scene.add(g);
const lane=Math.random()<0.5?-15:15;const vertical=Math.random()<0.5;let x,z,dirAngle;
if(vertical){x=(Math.random()<0.5?-400:0)+lane;z=-2000+Math.random()*4000;dirAngle=Math.random()<0.5?0:Math.PI;}
else{z=(Math.random()<0.5?-400:0)+lane;x=-2000+Math.random()*4000;dirAngle=Math.random()<0.5?Math.PI/2:-Math.PI/2;}
g.position.set(x,0,z);g.rotation.y=dirAngle;
vehicles.push({mesh:g,type,speed:type==='bike'?18:36,dir:dirAngle,lane,laneTarget:lane,laneTimer:0,kx:0,kz:0});}
for(let i=0;i<20;i++)makeVehicle('car');
for(let i=0;i<8;i++)makeVehicle('suv');
for(let i=0;i<3;i++)makeVehicle('monster');
for(let i=0;i<4;i++)makeVehicle('truck');
for(let i=0;i<3;i++)makeVehicle('bus');
for(let i=0;i<15;i++)makeVehicle('bike');
const cops=[];
function spawnCop(){const g=new THREE.Group();
const b=new THREE.Mesh(new THREE.BoxGeometry(2,1,4),new THREE.MeshLambertMaterial({color:0x0000ff}));b.position.y=0.7;g.add(b);
const light=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.3,0.5),new THREE.MeshLambertMaterial({color:0xff0000}));light.position.set(0,1.3,0);g.add(light);
g.position.set(Math.random()*400-200,0,Math.random()*400-200);scene.add(g);cops.push({mesh:g});}
let damage=0,points=0,money=0,wanted=0,boostEnergy=100,speedCap=149.85,currentShop=null;
let lightTimer=0,phase=0;const periods=[8,2,8,2];
function updateHUD(){document.getElementById('damage').textContent=Math.round(damage);document.getElementById('points').textContent=points;document.getElementById('money').textContent=money;document.getElementById('wanted').textContent=wanted;document.getElementById('boost').textContent=Math.round(boostEnergy);document.getElementById('shopMoney').textContent=money;}
function aabbHit(px,pz){for(const b of buildings){if(px>b.minX-1&&px<b.maxX+1&&pz>b.minZ-1&&pz<b.maxZ+1)return b}return null}
const clock=new THREE.Clock();
function animate(){requestAnimationFrame(animate);
const dt=Math.min(clock.getDelta(),0.05);
// Independent traffic light cycle
lightTimer+=dt;if(lightTimer>periods[phase]){lightTimer=0;phase=(phase+1)%4;}
const vColor=phase===0?0x00ff00:phase===1?0xffff00:0xff0000;
const hColor=phase===2?0x00ff00:phase===3?0xffff00:0xff0000;
lights.forEach(l=>{l.lampV.material.color.setHex(vColor);l.lampH.material.color.setHex(hColor);});
let throttle=0;if(input.up)throttle=1;if(input.down)throttle=-0.6;
let steer=0;if(input.left)steer=1;if(input.right)steer=-1;
let boosting=false;
if(input.boost&&boostEnergy>0){boosting=true;boostEnergy-=30*dt}else{boostEnergy=Math.min(100,boostEnergy+10*dt)}
const maxSpeed=boosting?166.5:speedCap;
speed+=throttle*(boosting?90:60)*dt;
speed-=speed*0.5*dt;
if(input.down&&speed>0)speed-=120*dt;
speed=Math.max(-20,Math.min(maxSpeed,speed));
heading+=steer*1.8*dt*(speed/30);
const forward=new THREE.Vector3(Math.sin(heading),0,Math.cos(heading));
pos.addScaledVector(forward,speed*dt);
pos.x=Math.max(-HALF+50,Math.min(HALF-50,pos.x));pos.z=Math.max(-HALF+50,Math.min(HALF-50,pos.z));
const hit=aabbHit(pos.x,pos.z);
if(hit){pos.addScaledVector(forward,-speed*dt);speed*=-0.3;damage+=5;updateHUD();}
rickshaw.position.copy(pos);rickshaw.rotation.y=heading;
const camOffset=new THREE.Vector3(0,6,-12).applyAxisAngle(new THREE.Vector3(0,1,0),heading);
camera.position.copy(pos).add(camOffset);camera.lookAt(pos.x,1,pos.z);
peds.forEach(p=>{
if(p.knocked){p.timer-=dt;
p.mesh.position.x+=p.kx*dt;p.mesh.position.z+=p.kz*dt;
p.kx*=0.9;p.kz*=0.9;
if(p.timer<=0){p.knocked=false;p.mesh.rotation.x=0;p.chasing=true}}
else if(p.chasing){const dx=pos.x-p.mesh.position.x,dz=pos.z-p.mesh.position.z,dist=Math.hypot(dx,dz);
if(dist<30){p.mesh.position.x+=dx/dist*6*dt;p.mesh.position.z+=dz/dist*6*dt;p.mesh.rotation.y=Math.atan2(dx,dz);}}
else{p.mesh.position.x+=Math.sin(p.dir)*6*dt;p.mesh.position.z+=Math.cos(p.dir)*6*dt;if(Math.random()<0.01)p.dir+=Math.PI/2;}
const dx=pos.x-p.mesh.position.x,dz=pos.z-p.mesh.position.z;
if(Math.hypot(dx,dz)<1.5&&!p.knocked){p.knocked=true;p.timer=3;p.mesh.rotation.x=Math.PI/2;
const away=new THREE.Vector3(dx,0,dz).normalize();p.kx=away.x*10;p.kz=away.z*10;
points+=10;money+=10;wanted+=1;updateHUD();}});
vehicles.forEach(v=>{
// Lane change
v.laneTimer+=dt;if(v.laneTimer>5){v.laneTimer=0;v.laneTarget=Math.random()<0.5?-15:15;}
const perp=new THREE.Vector3(Math.cos(v.dir),0,-Math.sin(v.dir));
const laneDelta=(v.laneTarget-v.lane)*dt*2;
v.lane+=laneDelta;
v.mesh.position.addScaledVector(perp,laneDelta);
// Traffic light stop per road direction
const isVertical=Math.abs(Math.sin(v.dir))<0.5;
const redForMe=isVertical?(phase===2||phase===3):(phase===0||phase===1);
if(redForMe){for(const l of lights){if(Math.hypot(v.mesh.position.x-l.x,v.mesh.position.z-l.z)<50){v.speed=0;break}}}
v.mesh.position.x+=Math.sin(v.dir)*v.speed*dt;v.mesh.position.z+=Math.cos(v.dir)*v.speed*dt;
// Bounce physics
v.mesh.position.x+=v.kx*dt;v.mesh.position.z+=v.kz*dt;
v.kx*=0.9;v.kz*=0.9;
if(v.mesh.position.x>HALF)v.mesh.position.x=-HALF;if(v.mesh.position.x<-HALF)v.mesh.position.x=HALF;
if(v.mesh.position.z>HALF)v.mesh.position.z=-HALF;if(v.mesh.position.z<-HALF)v.mesh.position.z=HALF;
const dx=pos.x-v.mesh.position.x,dz=pos.z-v.mesh.position.z;
if(Math.hypot(dx,dz)<2.5){damage+=v.type==='bike'?10:20;points+=v.type==='bike'?15:20;money+=v.type==='bike'?15:20;wanted+=1;
const away=new THREE.Vector3(dx,0,dz).normalize();
v.kx=away.x*15;v.kz=away.z*15;
v.mesh.position.addScaledVector(away,3);updateHUD();}});
cops.forEach(c=>{const dx=pos.x-c.mesh.position.x,dz=pos.z-c.mesh.position.z,dist=Math.hypot(dx,dz);
if(dist>2){c.mesh.position.x+=dx/dist*43*dt;c.mesh.position.z+=dz/dist*43*dt;c.mesh.rotation.y=Math.atan2(dx,dz);}
else{money=Math.max(0,money-20);updateHUD();}});
if(wanted>3&&cops.length<2)spawnCop();
let nearShop=null;
shops.forEach(s=>{if(Math.hypot(pos.x-s.x,pos.z-s.z)<10)nearShop=s});
currentShop=nearShop;
document.getElementById('shopHint').style.display=nearShop?'block':'none';
if(nearShop)document.getElementById('shopHint').textContent=`Press E / tap to enter ${nearShop.name}`;
document.getElementById('speed').textContent=Math.abs(Math.round(speed*3.6));
renderer.render(scene,camera);}
animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function openShop(){if(currentShop){document.getElementById('shopTitle').textContent=currentShop.name;document.getElementById('shopModal').classList.add('open')}}
document.getElementById('btnClose').onclick=()=>document.getElementById('shopModal').classList.remove('open');
document.getElementById('btnRepair').onclick=()=>{if(money>=50){money-=50;damage=0;updateHUD();document.getElementById('shopModal').classList.remove('open')}};
document.getElementById('btnBoostBuy').onclick=()=>{if(money>=100){money-=100;speedCap=180;updateHUD();document.getElementById('shopModal').classList.remove('open')}};
</script></body></html>
