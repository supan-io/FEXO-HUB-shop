<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Memory Match</title><style>body{margin:0;background:#070b16;color:#fff;font-family:system-ui;display:grid;place-items:center;min-height:100vh}.grid{display:grid;grid-template-columns:repeat(4,70px);gap:8px}.card{height:70px;background:#121829;border:2px solid #2a355a;border-radius:10px;font-size:28px}button{background:#7c5cff;color:#fff;border:0;padding:10px 14px;border-radius:8px;margin-top:12px}a{color:#9fb4ff}</style></head><body><div style="text-align:center"><h2>Memory Match</h2><div class="grid" id="g"></div><p id="msg">Find all pairs</p><button onclick="reset()">Restart</button><br><a href="../index.html">Back</a></div><script>let cards,open,matched,moves,matchedSet=new Set();function reset(){cards=["🍎","🍌","🍇","🍓","🍎","🍌","🍇","🍓"].sort(()=>Math.random()-.5);open=[];matched=0;moves=0;matchedSet.clear();draw()}function draw(){document.getElementById("g").innerHTML=cards.map((v,i)=>`<button class="card" onclick="flip(${i})">${open.includes(i)||matchedSet.has(i)?v:""}</button>`).join("")}function flip(i){if(open.includes(i)||matchedSet.has(i)||open.length===2)return;open.push(i);draw();if(open.length===2){moves++;setTimeout(()=>{const[a,b]=open;if(cards[a]===cards[b]){matchedSet.add(a);matchedSet.add(b);matched++}open=[];draw();if(matched===4){document.getElementById("msg").textContent="You win!";submit()}},550)}}function submit(){parent.postMessage({type:"FEXO_GAME_SCORE",game:"memory",score:Math.max(50,500-moves*10)},"*")}reset()</script></body></html>
